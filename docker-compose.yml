# SegueIT Projects — run everything with one command:
#
#   docker compose up --build
#
# Then open http://localhost:3000 and sign in with the root account defined in
# apps/api/prisma/seed-data.ts (ROOT_ACCOUNT); change its password after the first sign-in.
#
# Settings below can be overridden from your shell or a `.env` file next to this one,
# e.g. SEED_DEMO_DATA=true docker compose up --build

name: segueit-projects

services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-SegueIT Projects}
      # Set to true when the site is served over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      # Leave empty to auto-generate and store them in the data volume.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      # Hour (organization time zone) when everyone is told about that day's meetings.
      MEETING_DIGEST_HOUR: ${MEETING_DIGEST_HOUR:-8}
      # true adds a demo organization with sample users and projects (see prisma/seed-data.ts).
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    volumes:
      - api-data:/data

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_APP_NAME: ${APP_NAME:-SegueIT Projects}
        NEXT_PUBLIC_BRAND_COLOR: ${BRAND_COLOR:-#0b5cad}
        API_PROXY_TARGET: http://api:4000/api
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
